<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded Background with Deep Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer squircle container -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Decorative Ambient Circle Glows -->
  <circle cx="256" cy="256" r="160" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="256" r="110" fill="#ec4899" opacity="0.1" filter="url(#glow)" />

  <!-- Abstract soundwaves (Louvor) in background -->
  <g opacity="0.8">
    <path d="M 120 256 C 120 210, 160 210, 160 256 C 160 302, 120 302, 120 256 Z" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    <path d="M 90 256 C 90 180, 150 180, 150 256 C 150 332, 90 332, 90 256 Z" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.15"/>
    
    <path d="M 392 256 C 392 210, 352 210, 352 256 C 352 302, 392 302, 392 256 Z" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    <path d="M 422 256 C 422 180, 362 180, 362 256 C 362 332, 422 332, 422 256 Z" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.15"/>
  </g>

  <!-- Sound wave bars centered horizontally -->
  <g fill="url(#goldGrad)" opacity="0.6">
    <rect x="180" y="220" width="8" height="72" rx="4" />
    <rect x="200" y="190" width="8" height="132" rx="4" />
    <rect x="220" y="160" width="8" height="192" rx="4" />
    
    <rect x="284" y="160" width="8" height="192" rx="4" />
    <rect x="304" y="190" width="8" height="132" rx="4" />
    <rect x="324" y="220" width="8" height="72" rx="4" />
  </g>

  <!-- Cross in the center, overlapping beautifully -->
  <g filter="url(#glow)">
    <!-- Vertical bar -->
    <rect x="242" y="100" width="28" height="312" rx="14" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />
    <!-- Horizontal bar -->
    <rect x="156" y="180" width="200" height="28" rx="14" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Sparkle / Star elements representing worship & excellence -->
  <path d="M 256 60 L 260 75 L 275 79 L 260 83 L 256 98 L 252 83 L 237 79 L 252 75 Z" fill="#ffffff" />
  <path d="M 140 130 L 142 138 L 150 140 L 142 142 L 140 150 L 138 142 L 130 140 L 138 138 Z" fill="#fef08a" />
  <path d="M 370 130 L 372 138 L 380 140 L 372 142 L 370 150 L 368 142 L 360 140 L 368 138 Z" fill="#fef08a" />
</svg>
