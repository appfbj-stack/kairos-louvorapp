services:
  kairos-louvorapp:
    build: .
    container_name: kairos-louvorapp-app
    restart: unless-stopped
    ports:
      # Só localhost — o acesso público é feito pelo Caddy
      - "127.0.0.1:3017:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-kairos-louvor-jwt-secret-2026-rotate-em-prod-A8nM3kP9xR2wT}
      - APP_URL=${APP_URL:-https://louvorapp.fbautomacao.space}
      - ADMIN_URL=${ADMIN_URL:-https://admin.louvorapp.fbautomacao.space}
      # Conexão com o Postgres compartilhado (kairos-shared-pg)
      - DATABASE_URL=postgresql://kairos_louvorapp_user:Louvor@k@i0s!2026@kairos-shared-pg:5432/kairos_louvorapp_db
      # —— IA (MiniMax M3) — assistente Kairós + funções de cifras ——
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M3}
    networks:
      # Precisa ser a dokploy-network: é onde o kairos-shared-pg está.
      # Na rede bridge default o container NÃO enxerga o Postgres por DNS.
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dokploy-network:
    external: true